[package]
name = "volparossa-bank-paper-payments"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false
description = "Owner-local TEST-unit payment intents using the pinned VOLPAROSSA core"

# Keep the existing dependency-free portfolio prototype independent of this adapter.
[workspace]

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
prost = "0.14.1"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
volparossa-transaction = { git = "https://github.com/VOLPAROSSA/volparossa", rev = "4619c1c10ff1bbad8b226c5fc801615a0d2c4758" }

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
tempfile = "3.20.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = 1
