[package]
name = "volparossa-bank-paper-payments"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false
description = "Retained TEST-unit intents for pinned local and ordered VOLPAROSSA core stores"

# Keep the existing dependency-free portfolio prototype independent of this adapter.
[workspace]

[features]
owner-cli = ["dep:getrandom", "dep:tempfile", "dep:volparossa-transaction-abci"]

[[bin]]
name = "bank-test-authorizer"
path = "src/bin/bank-test-authorizer/main.rs"
required-features = ["owner-cli"]

[dependencies]
getrandom = { version = "0.4.3", features = ["sys_rng"], optional = true }
tempfile = { version = "3.20.0", optional = true }
volparossa-transaction-abci = { git = "https://github.com/VOLPAROSSA/volparossa", rev = "37ce7b46d2f70ba4e3b3403c1f2e91f974518ed3", optional = true }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize"] }
prost = "0.14.1"
rustix = { version = "=1.1.6", features = ["fs", "process"] }
sha2 = "0.11.0"
thiserror = "2.0.12"
volparossa-transaction = { git = "https://github.com/VOLPAROSSA/volparossa", rev = "37ce7b46d2f70ba4e3b3403c1f2e91f974518ed3" }

[dev-dependencies]
getrandom = { version = "0.4.3", features = ["sys_rng"] }
tempfile = "3.20.0"
volparossa-transaction-abci = { git = "https://github.com/VOLPAROSSA/volparossa", rev = "37ce7b46d2f70ba4e3b3403c1f2e91f974518ed3" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = 1
